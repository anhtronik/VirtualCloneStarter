name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Buat project Android baru
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/digitalizha/virtualclone
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VirtualCloneStarter"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=false
          android.enableJetifier=false
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.digitalizha.virtualclone"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.digitalizha.virtualclone"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Virtual Clone Starter</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#2196F3</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/digitalizha/virtualclone/MainActivity.java <<'EOF'
          package com.digitalizha.virtualclone;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.graphics.Typeface;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class MainActivity extends Activity {
              private final ArrayList<AppItem> apps = new ArrayList<>();
              private final ArrayList<CloneItem> clones = new ArrayList<>();
              private AppAdapter appAdapter;
              private CloneAdapter cloneAdapter;
              private SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences("virtual_clone_data", MODE_PRIVATE);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(14), dp(14), dp(14), dp(14));

                  TextView title = new TextView(this);
                  title.setText("Virtual Clone Starter");
                  title.setTextSize(24);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText("Pilih aplikasi untuk membuat slot clone. Versi ini starter/pondasi, belum virtual engine penuh.");
                  info.setTextSize(14);
                  info.setPadding(0, dp(6), 0, dp(10));
                  root.addView(info);

                  Button refresh = new Button(this);
                  refresh.setText("Refresh Daftar Aplikasi");
                  root.addView(refresh);

                  TextView cloneTitle = new TextView(this);
                  cloneTitle.setText("Daftar Clone");
                  cloneTitle.setTextSize(18);
                  cloneTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  cloneTitle.setPadding(0, dp(12), 0, dp(6));
                  root.addView(cloneTitle);

                  ListView cloneList = new ListView(this);
                  root.addView(cloneList, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(220)));

                  TextView appTitle = new TextView(this);
                  appTitle.setText("Aplikasi Terpasang");
                  appTitle.setTextSize(18);
                  appTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  appTitle.setPadding(0, dp(12), 0, dp(6));
                  root.addView(appTitle);

                  ListView appList = new ListView(this);
                  root.addView(appList, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1));

                  setContentView(root);

                  appAdapter = new AppAdapter();
                  cloneAdapter = new CloneAdapter();
                  appList.setAdapter(appAdapter);
                  cloneList.setAdapter(cloneAdapter);

                  refresh.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          loadApps();
                      }
                  });

                  appList.setOnItemClickListener((parent, view, position, id) -> {
                      AppItem app = apps.get(position);
                      addClone(app);
                  });

                  cloneList.setOnItemClickListener((parent, view, position, id) -> {
                      CloneItem clone = clones.get(position);
                      launchOriginalApp(clone.packageName);
                  });

                  cloneList.setOnItemLongClickListener((parent, view, position, id) -> {
                      clones.remove(position);
                      saveClones();
                      cloneAdapter.notifyDataSetChanged();
                      Toast.makeText(this, "Clone dihapus", Toast.LENGTH_SHORT).show();
                      return true;
                  });

                  loadClones();
                  loadApps();
              }

              private void loadApps() {
                  apps.clear();

                  PackageManager pm = getPackageManager();
                  Intent intent = new Intent(Intent.ACTION_MAIN);
                  intent.addCategory(Intent.CATEGORY_LAUNCHER);

                  List<ResolveInfo> list = pm.queryIntentActivities(intent, 0);

                  for (ResolveInfo info : list) {
                      String label = info.loadLabel(pm).toString();
                      String pkg = info.activityInfo.packageName;

                      if (!pkg.equals(getPackageName())) {
                          apps.add(new AppItem(label, pkg));
                      }
                  }

                  Collections.sort(apps, new Comparator<AppItem>() {
                      @Override
                      public int compare(AppItem a, AppItem b) {
                          return a.label.compareToIgnoreCase(b.label);
                      }
                  });

                  appAdapter.notifyDataSetChanged();
                  Toast.makeText(this, "Aplikasi ditemukan: " + apps.size(), Toast.LENGTH_SHORT).show();
              }

              private void addClone(AppItem app) {
                  int number = 1;
                  for (CloneItem item : clones) {
                      if (item.packageName.equals(app.packageName)) {
                          number++;
                      }
                  }

                  clones.add(new CloneItem(app.label + " Clone #" + number, app.packageName));
                  saveClones();
                  cloneAdapter.notifyDataSetChanged();

                  Toast.makeText(this, "Clone slot dibuat: " + app.label, Toast.LENGTH_SHORT).show();
              }

              private void launchOriginalApp(String packageName) {
                  Intent launchIntent = getPackageManager().getLaunchIntentForPackage(packageName);
                  if (launchIntent != null) {
                      startActivity(launchIntent);
                  } else {
                      Toast.makeText(this, "Aplikasi tidak bisa dibuka", Toast.LENGTH_SHORT).show();
                  }
              }

              private void loadClones() {
                  clones.clear();
                  String json = prefs.getString("clones", "[]");

                  try {
                      JSONArray arr = new JSONArray(json);
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject obj = arr.getJSONObject(i);
                          clones.add(new CloneItem(
                                  obj.getString("label"),
                                  obj.getString("packageName")
                          ));
                      }
                  } catch (Exception e) {
                      prefs.edit().remove("clones").apply();
                  }
              }

              private void saveClones() {
                  JSONArray arr = new JSONArray();

                  try {
                      for (CloneItem item : clones) {
                          JSONObject obj = new JSONObject();
                          obj.put("label", item.label);
                          obj.put("packageName", item.packageName);
                          arr.put(obj);
                      }
                  } catch (Exception ignored) {}

                  prefs.edit().putString("clones", arr.toString()).apply();
              }

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density);
              }

              private class AppAdapter extends BaseAdapter {
                  @Override
                  public int getCount() {
                      return apps.size();
                  }

                  @Override
                  public Object getItem(int position) {
                      return apps.get(position);
                  }

                  @Override
                  public long getItemId(int position) {
                      return position;
                  }

                  @Override
                  public View getView(int position, View convertView, ViewGroup parent) {
                      TextView text = new TextView(MainActivity.this);
                      AppItem app = apps.get(position);
                      text.setText(app.label + "\n" + app.packageName + "\nTekan untuk buat clone slot");
                      text.setTextSize(15);
                      text.setPadding(dp(10), dp(10), dp(10), dp(10));
                      return text;
                  }
              }

              private class CloneAdapter extends BaseAdapter {
                  @Override
                  public int getCount() {
                      return clones.size();
                  }

                  @Override
                  public Object getItem(int position) {
                      return clones.get(position);
                  }

                  @Override
                  public long getItemId(int position) {
                      return position;
                  }

                  @Override
                  public View getView(int position, View convertView, ViewGroup parent) {
                      TextView text = new TextView(MainActivity.this);
                      CloneItem clone = clones.get(position);
                      text.setText(clone.label + "\n" + clone.packageName + "\nTekan untuk buka, tahan untuk hapus");
                      text.setTextSize(15);
                      text.setPadding(dp(10), dp(10), dp(10), dp(10));
                      return text;
                  }
              }

              private static class AppItem {
                  String label;
                  String packageName;

                  AppItem(String label, String packageName) {
                      this.label = label;
                      this.packageName = packageName;
                  }
              }

              private static class CloneItem {
                  String label;
                  String packageName;

                  CloneItem(String label, String packageName) {
                      this.label = label;
                      this.packageName = packageName;
                  }
              }
          }
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --stacktrace > build-log.txt 2>&1
          RESULT=$?
          echo "======= ERROR PENTING ======="
          grep -n -A 40 -B 15 "What went wrong\|Execution failed\|error:\|FAILED" build-log.txt || true
          echo "======= AKHIR ERROR ======="
          cat build-log.txt | tail -120
          exit $RESULT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCloneStarter-apk
          path: app/build/outputs/apk/debug/*.apk          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.nakula.virtualclonestarter"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.nakula.virtualclonestarter"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Virtual Clone Starter</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#2196F3</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name="com.nakula.virtualclonestarter.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/nakula/virtualclonestarter/MainActivity.java <<'EOF'
          package com.nakula.virtualclonestarter;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private LinearLayout cloneBox;
              private LinearLayout appBox;
              private SharedPreferences prefs;
              private PackageManager pm;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("clone_slots", MODE_PRIVATE);
                  pm = getPackageManager();

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(22), dp(18), dp(22));
                  scroll.addView(root);

                  TextView title = new TextView(this);
                  title.setText("Virtual Clone Starter");
                  title.setTextSize(25);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText("Versi awal: pilih aplikasi, buat slot clone, dan buka aplikasi asli. Engine virtual penuh ditambahkan tahap berikutnya.");
                  info.setTextSize(14);
                  info.setPadding(0, dp(8), 0, dp(14));
                  root.addView(info);

                  TextView cloneTitle = sectionTitle("Slot Clone");
                  root.addView(cloneTitle);
                  cloneBox = new LinearLayout(this);
                  cloneBox.setOrientation(LinearLayout.VERTICAL);
                  root.addView(cloneBox);

                  LinearLayout actions = new LinearLayout(this);
                  actions.setOrientation(LinearLayout.HORIZONTAL);
                  actions.setPadding(0, dp(8), 0, dp(12));
                  Button reload = new Button(this);
                  reload.setText("Muat aplikasi");
                  reload.setOnClickListener(v -> loadApps());
                  actions.addView(reload, new LinearLayout.LayoutParams(0, -2, 1));
                  Button clear = new Button(this);
                  clear.setText("Hapus slot");
                  clear.setOnClickListener(v -> {
                      prefs.edit().clear().apply();
                      renderClones();
                      Toast.makeText(this, "Slot clone dihapus", Toast.LENGTH_SHORT).show();
                  });
                  actions.addView(clear, new LinearLayout.LayoutParams(0, -2, 1));
                  root.addView(actions);

                  root.addView(sectionTitle("Daftar Aplikasi"));
                  appBox = new LinearLayout(this);
                  appBox.setOrientation(LinearLayout.VERTICAL);
                  root.addView(appBox);

                  setContentView(scroll);
                  renderClones();
                  loadApps();
              }

              private TextView sectionTitle(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(18);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setPadding(0, dp(12), 0, dp(8));
                  return t;
              }

              private void loadApps() {
                  appBox.removeAllViews();
                  Intent main = new Intent(Intent.ACTION_MAIN, null);
                  main.addCategory(Intent.CATEGORY_LAUNCHER);
                  List<ResolveInfo> apps = pm.queryIntentActivities(main, 0);
                  Collections.sort(apps, new ResolveInfo.DisplayNameComparator(pm));

                  int shown = 0;
                  for (ResolveInfo ri : apps) {
                      String pkg = ri.activityInfo.packageName;
                      if (pkg.equals(getPackageName())) continue;
                      String label = ri.loadLabel(pm).toString();
                      appBox.addView(appRow(label, pkg, ri));
                      shown++;
                  }
                  if (shown == 0) {
                      TextView empty = new TextView(this);
                      empty.setText("Aplikasi tidak ditemukan.");
                      appBox.addView(empty);
                  }
              }

              private View appRow(String label, String pkg, ResolveInfo ri) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(0, dp(8), 0, dp(8));

                  ImageView icon = new ImageView(this);
                  icon.setImageDrawable(ri.loadIcon(pm));
                  row.addView(icon, new LinearLayout.LayoutParams(dp(42), dp(42)));

                  LinearLayout texts = new LinearLayout(this);
                  texts.setOrientation(LinearLayout.VERTICAL);
                  texts.setPadding(dp(10), 0, dp(10), 0);
                  TextView name = new TextView(this);
                  name.setText(label);
                  name.setTextSize(16);
                  name.setTypeface(Typeface.DEFAULT_BOLD);
                  TextView pack = new TextView(this);
                  pack.setText(pkg);
                  pack.setTextSize(12);
                  texts.addView(name);
                  texts.addView(pack);
                  row.addView(texts, new LinearLayout.LayoutParams(0, -2, 1));

                  Button add = new Button(this);
                  add.setText("Tambah");
                  add.setOnClickListener(v -> addClone(label, pkg));
                  row.addView(add);
                  return row;
              }

              private void addClone(String label, String pkg) {
                  int count = prefs.getInt("count", 0) + 1;
                  prefs.edit()
                          .putInt("count", count)
                          .putString("clone_" + count, label + "||" + pkg)
                          .apply();
                  renderClones();
                  Toast.makeText(this, "Slot dibuat: " + label + " #" + count, Toast.LENGTH_SHORT).show();
              }

              private void renderClones() {
                  cloneBox.removeAllViews();
                  int count = prefs.getInt("count", 0);
                  int shown = 0;
                  for (int i = 1; i <= count; i++) {
                      String data = prefs.getString("clone_" + i, null);
                      if (data == null) continue;
                      String[] p = data.split("\\|\\|", 2);
                      String label = p.length > 0 ? p[0] : "App";
                      String pkg = p.length > 1 ? p[1] : "";
                      cloneBox.addView(cloneRow(i, label, pkg));
                      shown++;
                  }
                  if (shown == 0) {
                      TextView empty = new TextView(this);
                      empty.setText("Belum ada slot clone. Tekan Tambah pada aplikasi di bawah.");
                      empty.setPadding(0, dp(4), 0, dp(4));
                      cloneBox.addView(empty);
                  }
              }

              private View cloneRow(int index, String label, String pkg) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.VERTICAL);
                  row.setPadding(dp(12), dp(10), dp(12), dp(10));
                  row.setBackgroundColor(0xFFEFEFEF);

                  TextView name = new TextView(this);
                  name.setText(String.format(Locale.US, "%s Clone #%d", label, index));
                  name.setTextSize(16);
                  name.setTypeface(Typeface.DEFAULT_BOLD);
                  row.addView(name);

                  TextView pack = new TextView(this);
                  pack.setText(pkg);
                  pack.setTextSize(12);
                  row.addView(pack);

                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setOrientation(LinearLayout.HORIZONTAL);
                  Button open = new Button(this);
                  open.setText("Buka app asli");
                  open.setOnClickListener(v -> openApp(pkg));
                  buttons.addView(open, new LinearLayout.LayoutParams(0, -2, 1));
                  Button del = new Button(this);
                  del.setText("Hapus");
                  del.setOnClickListener(v -> {
                      prefs.edit().remove("clone_" + index).apply();
                      renderClones();
                  });
                  buttons.addView(del, new LinearLayout.LayoutParams(0, -2, 1));
                  row.addView(buttons);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.setMargins(0, 0, 0, dp(8));
                  row.setLayoutParams(lp);
                  return row;
              }

              private void openApp(String pkg) {
                  Intent launch = pm.getLaunchIntentForPackage(pkg);
                  if (launch == null) {
                      Toast.makeText(this, "App tidak bisa dibuka", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  startActivity(launch);
              }

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCloneStarter-apk
          path: app/build/outputs/apk/debug/*.apk
