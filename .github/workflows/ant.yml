name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Rapikan struktur project Android
        run: |
          mkdir -p app/src/main/java/com/digitalizha/apkcloner
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          if ls *.java 1> /dev/null 2>&1; then
            mv *.java app/src/main/java/com/digitalizha/apkcloner/
          fi

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ -f file_paths.xml ]; then
            mv file_paths.xml app/src/main/res/xml/file_paths.xml
          fi

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "APKClonerStarter"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.digitalizha.apkcloner"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.digitalizha.apkcloner"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core:1.13.1")
              implementation("com.android.tools.build:apksig:8.6.1")
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">APK Cloner Starter</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APKClonerStarter-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCloneStarter-apk
          path: app/build/outputs/apk/debug/*.apk
